# /etc/nginx/sites-available/growroom
# Symlink: ln -s /etc/nginx/sites-available/growroom /etc/nginx/sites-enabled/growroom
#
# Adjust server_name to your domain or server IP.

server {
    listen 80;
    server_name growroom.example.com;   # <-- change this

    # React frontend (static files)
    root /home/YOUR_USER/growroom/frontend;  # <-- change YOUR_USER
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: increase timeout for long-poll sensor endpoints
    proxy_read_timeout 60s;
}
