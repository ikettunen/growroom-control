name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: []  # remove if you want CI to gate deploy: set to [backend, frontend] and reference ci.yml

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: growroom-backend/server/package-lock.json

      - name: Build backend
        working-directory: growroom-backend/server
        run: |
          npm ci
          npm run build

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/growroom/backend
            cd ~/growroom/backend

            # Pull latest source and rebuild on server (avoids binary mismatch)
            git -C . pull || git clone https://github.com/${{ github.repository }} .
            cd growroom-backend/server
            npm ci --omit=dev
            npm run build

            # Write .env if it doesn't exist yet (first deploy)
            if [ ! -f .env ]; then
              cp .env.example .env 2>/dev/null || true
            fi

            pm2 restart growroom-backend 2>/dev/null || \
              pm2 start dist/index.js --name growroom-backend \
                --env production \
                -- --max-old-space-size=256
            pm2 save

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Build frontend
        working-directory: growroom-dashboard/frontend/growroom-dashboard
        run: |
          npm ci
          npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          CI: false

      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: growroom-dashboard/frontend/growroom-dashboard/build/*
          target: ~/growroom/frontend/
          strip_components: 5

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: sudo nginx -s reload
